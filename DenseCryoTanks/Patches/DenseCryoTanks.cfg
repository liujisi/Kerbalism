// DenseCryoTanks: cloned regular CryoTanks stack tanks with denser LH2 modes.
// Resource capacity and tank dry mass are scaled together to preserve dry/full ratios.
B9_TANK_TYPE:NEEDS[CryoTanks,B9PartSwitch]
{
	name = DenseLH2OCryo
	tankMass = 0.00069726
	tankCost = 0
	RESOURCE
	{
		name = LqdHydrogen
		unitsPerVolume = 12.4875
	}
	RESOURCE
	{
		name = Oxidizer
		unitsPerVolume = 0.8325
	}
}

B9_TANK_TYPE:NEEDS[CryoTanks,B9PartSwitch]
{
	name = DenseLH2Cryo
	tankMass = 0.00106275
	tankCost = 0.2
	RESOURCE
	{
		name = LqdHydrogen
		unitsPerVolume = 75
	}
}

+PART[hydrogen-10-1]:NEEDS[CryoTanks,B9PartSwitch]:AFTER[zzz_CryoTanks]
{
	@name = dense-hydrogen-10-1
	@title = Dense H1000-1152 Cryogenic Fuel Tank
	@manufacturer = Isogrid Cryogenics
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE[LH2/O]
		{
			@tankType = DenseLH2OCryo
		}
		@SUBTYPE[LH2]
		{
			@tankType = DenseLH2Cryo
		}
	}
}

