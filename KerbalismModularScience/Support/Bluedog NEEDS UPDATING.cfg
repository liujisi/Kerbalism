@KERBALISM_EXPERIMENT_VALUES:NEEDS[Bluedog_DB,FeatureScience]
{
  %Bluedog_DB
  {
    bd_TrappedRadiation
    {
     	size = 2         // size in MB. If the experiment is a sample, this define how many slots it uses :  1024 MB = 1 slot.
	value = 12
     	duration = 3600 
	ec_rate = 0.5
    }
  }
}

@EXPERIMENT_DEFINITION:HAS[#id[bd_TrappedRadiation]]:NEEDS[Bluedog_DB,FeatureScience]:FOR[zzzKerbalismModularScience]
{
	@baseValue = #$@KERBALISM_EXPERIMENT_VALUES/Bluedog_DB/bd_TrappedRadiation/value$
  	@dataScale = #$@KERBALISM_EXPERIMENT_VALUES/Bluedog_DB/bd_TrappedRadiation/size$
  	@dataScale /= #$baseValue$
  
  KERBALISM_EXPERIMENT
  {
		Situation = InSpaceLow
    		Situation = InSpaceHigh
    
 
  }
}


@PART[*]:HAS[@MODULE[*ModuleScience*]:HAS[#experimentID[bd_TrappedRadiation]]]:NEEDS[Bluedog_DB,FeatureScience]
{
    
    MODULE
    {
      name = Experiment
      experiment_id = bd_TrappedRadiation

	
      data_rate = #$@KERBALISM_EXPERIMENT_VALUES/Bluedog_DB/bd_TrappedRadiation/size$
      @data_rate /= #$@KERBALISM_EXPERIMENT_VALUES/Bluedog_DB/bd_TrappedRadiation/duration$
            ec_rate = #$@KERBALISM_EXPERIMENT_VALUES/Bluedog_DB/bd_TrappedRadiation/ec_rate$
      allow_shrouded = False
	anim_deploy = deploy
      //requires = SunAngleMin:5,SunAngleMax:60
    }
    
    ModuleScienceExperiment)
    !MODULE:HAS[#experimentID,~name[Experiment]] {}
}

