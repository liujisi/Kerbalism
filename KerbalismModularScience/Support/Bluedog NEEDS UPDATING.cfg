	{
		name = Laboratory
		researcher = Scientist
		analysis_rate = 0.012 // 12 kbps (since it's a smaller and earlier along the tech tree)
		ec_rate = 3.6
	}

	!MODULE[ModuleScienceLab] {}
	!MODULE[ModuleScienceConverter] {}
