// Kerbalism 3.23+ models EVA Kerbals as habitats. These resources are
// internal dependencies of that EVA container even when habitat features
// are disabled by the ModularScience profile.

RESOURCE_DEFINITION:NEEDS[ProfileModularScience,!WildBlueTools]
{
  name = Atmosphere
  displayName = #KERBALISM_Resource_Atmosphere
  density = 0.000001251
  unitCost = 0.0
  flowMode = ALL_VESSEL
  transfer = PUMP
  isTweakable = false
  isVisible = false
  volume = 1
}

RESOURCE_DEFINITION:NEEDS[ProfileModularScience]
{
  name = WasteAtmosphere
  displayName = #KERBALISM_Resource_WasteAtmosphere
  density = 0.000001951
  unitCost = 0.0
  flowMode = ALL_VESSEL
  transfer = NONE
  isTweakable = false
  isVisible = false
  volume = 1
}

RESOURCE_DEFINITION:NEEDS[ProfileModularScience]
{
  name = Shielding
  displayName = #KERBALISM_Resource_Shielding
  density = 0.075
  unitCost = 175.0
  flowMode = ALL_VESSEL
  transfer = NONE
  isTweakable = true
  volume = 1
  RESOURCE_DRAIN_DEFINITION
  {
    isDrainable = false
  }
}

// WildBlueTools also defines Atmosphere with airship-specific properties.
// Kerbalism's EVA Habitat expects liters of nitrogen at STP instead.
@RESOURCE_DEFINITION[Atmosphere]:NEEDS[ProfileModularScience,WildBlueTools]:FOR[zzzKerbalismModularScience]
{
  @density = 0.000001251
  @unitCost = 0.0
  @flowMode = ALL_VESSEL
  @transfer = PUMP
  @isTweakable = false
  @isVisible = false
  @volume = 1
}
