// Native SystemHeat converters/harvesters -> KerbalismUpdater sidecars

// Converters (non-Chemical Plant)
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],!MODULE[ProcessControllerSystemHeat],!MODULE[Configure]:HAS[#title[Chemical?Plant]],!MODULE[SystemHeatConverterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],0/moduleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Converter
		considered = true
	}
}

// Add updater sidecar for a second converter on multi-converter parts
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],1]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],1/moduleID$
	}
}

// Add updater sidecar for a third converter (rare but complete)
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],2]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],2/moduleID$
	}
}

// Harvesters (non-Kerbalism Drill path)
@PART[*]:HAS[@MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],!MODULE[HarvesterSystemHeat],!MODULE[Configure]:HAS[#title[Drill]],!MODULE[SystemHeatHarvesterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatHarvesterKerbalismUpdater
		harvesterModuleID = #$../MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],0/moduleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Harvester
		considered = true
	}
}

// Add updater sidecar for a second harvester on multi-harvester parts
@PART[*]:HAS[@MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],1]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatHarvesterKerbalismUpdater
		harvesterModuleID = #$../MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],1/moduleID$
	}
}
