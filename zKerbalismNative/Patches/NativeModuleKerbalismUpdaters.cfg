// Native SystemHeat converters/harvesters -> KerbalismUpdater sidecars

// Converters (non-Chemical Plant) — first converter (index 0)
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],!MODULE[ProcessControllerSystemHeat],!MODULE[Configure]:HAS[#title[Chemical?Plant]],!MODULE[SystemHeatConverterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],0/moduleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Converter
		considered = true
	}
}

// Second converter (index 1) on parts that have at least 2 converters
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],1,!MODULE[ProcessControllerSystemHeat],!MODULE[Configure]:HAS[#title[Chemical?Plant]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],1/moduleID$
	}
}

// Third converter (index 2) 
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],2,!MODULE[ProcessControllerSystemHeat],!MODULE[Configure]:HAS[#title[Chemical?Plant]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],2/moduleID$
	}
}

// Fourth converter (index 3) — for FFT nuclear smelter
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],3,!MODULE[ProcessControllerSystemHeat],!MODULE[Configure]:HAS[#title[Chemical?Plant]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],3/moduleID$
	}
}

// Harvesters (non-Kerbalism Drill path) — first harvester (index 0)
@PART[*]:HAS[@MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],!MODULE[HarvesterSystemHeat],!MODULE[Configure]:HAS[#title[Drill]],!MODULE[SystemHeatHarvesterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatHarvesterKerbalismUpdater
		harvesterModuleID = #$../MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],0/moduleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Harvester
		considered = true
	}
}

// Second harvester (index 1)
@PART[*]:HAS[@MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],1,!MODULE[HarvesterSystemHeat],!MODULE[Configure]:HAS[#title[Drill]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatHarvesterKerbalismUpdater
		harvesterModuleID = #$../MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[*]],1/moduleID$
	}
}
