@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[remelterEC]],!MODULE[SystemHeatConverterKerbalismUpdater]:HAS[#converterModuleID[remelterEC]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:AFTER[zzzzzz_KerbalismNative]
