// Native SystemHeat converters/harvesters -> KerbalismUpdater sidecars

// Primary (index-0) converter: covers first converter on all eligible parts
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],!MODULE[ProcessControllerSystemHeat],!MODULE[Configure]:HAS[#title[Chemical?Plant]],!MODULE[SystemHeatConverterKerbalismUpdater]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:FOR[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = #$../MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[*]],0/moduleID$
	}

	MODULE
	{
		name = PlannerController
		title = #LOC_KerbalismBridge_Brokers_Converter
		considered = true
	}
}

// Secondary converters: explicit moduleID targeting for multi-converter parts

// EL LFO remelter (2nd converter on EL smelters)
@PART[*]:HAS[@MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[remelterLFO]],!MODULE[SystemHeatConverterKerbalismUpdater]:HAS[#converterModuleID[remelterLFO]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismNative]:AFTER[zzzzzz_KerbalismNative]
{
	MODULE
	{
		name = SystemHeatConverterKerbalismUpdater
		converterModuleID = remelterLFO
	}
}

