@Profile[KerbalismSupport]:HAS[#moddir[RationalResourcesKerbalism]]:NEEDS[Kerbalism,RationalResourcesKerbalism,ProfileModularScience]:AFTER[RationalResourcesKerbalism]
{
	// ModularScience keeps science-only Kerbalism but RR expects the default
	// converter recipes. Add those recipes, trimming unsupported Shielding.
	!Process:HAS[#modifier[_WaterElectrolysis]],* {}
	!Process:HAS[#modifier[_WasteIncinerator]],* {}
	!Process:HAS[#modifier[_Sabatier]],* {}
	!Process:HAS[#modifier[_Haber]],* {}
	!Process:HAS[#modifier[_Anthraquinone]],* {}
	!Process:HAS[#modifier[_HydrazineProduction]],* {}
	!Process:HAS[#modifier[_NitroHydrazine]],* {}
	!Process:HAS[#modifier[_SOE]],* {}
	!Process:HAS[#modifier[_MRE]],* {}
	!Process:HAS[#modifier[_SCO]],* {}
	!Process:HAS[#modifier[_MRER]],* {}

	Process
	{
		name = water electrolysis
		title = #KERBALISM_Process_WaterElectrolysis
		modifier = _WaterElectrolysis
		input = ElectricCharge@2.4026694940
		input = Water@0.0008043014
		output = Hydrogen@1.0011122892
		output = Oxygen@0.5065967413
		dump_valve = Hydrogen,Oxygen
	}

	Process
	{
		name = waste incinerator
		title = #KERBALISM_Process_WasteIncinerator
		modifier = _WasteIncinerator
		input = Waste@0.0001082667
		input = Oxygen@0.1589194249
		output = CarbonDioxide@0.1497439605
		output = Water@0.0000131259
		output = ElectricCharge@0.005
		dump_valve = Water,ElectricCharge,Water&ElectricCharge
	}

	Process
	{
		name = sabatier process
		title = #KERBALISM_Process_SabatierProcess
		modifier = _Sabatier
		input = ElectricCharge@0.008082126
		input = CarbonDioxide@3.490273221
		input = Hydrogen@13.87826691
		output = Water@0.005574954
		output = LiquidFuel@0.000496445
		dump_valve = Water,LiquidFuel
	}

	Process
	{
		name = haber process
		title = #KERBALISM_Process_HaberProcess
		modifier = _Haber
		input = ElectricCharge@0.00594773
		input = Nitrogen@1.3315033550
		input = Hydrogen@4.0
		output = Ammonia@2.6336940144
	}

	Process
	{
		name = anthraquinone process
		title = #KERBALISM_Process_AnthraquinoneProcess
		modifier = _Anthraquinone
		input = Hydrogen@2.0
		input = Oxygen@2.0241355411
		output = Oxidizer@0.0006067662
	}

	Process
	{
		name = hydrazine production
		title = #KERBALISM_Process_HydrazineProduction
		modifier = _HydrazineProduction
		input = ElectricCharge@0.023871584
		input = Ammonia@4.7203389609
		input = Oxidizer@0.0014500000
		output = Water@0.0057597534
		output = Oxygen@1.2092781475
		output = MonoPropellant@0.0008537763
		dump_valve = Water,Oxygen,MonoPropellant,Water&Oxygen,Water&MonoPropellant,Oxygen&MonoPropellant
	}

	Process
	{
		name = hydrazine production N2 injection
		title = #KERBALISM_Process_HydrazineProductionN2
		modifier = _NitroHydrazine
		input = ElectricCharge@0.059678961
		input = Ammonia@4.7203389609
		input = Oxidizer@0.0014500000
		input = Nitrogen@3.5796568216
		output = Oxygen@4.8371125902
		output = MonoPropellant@0.0021344406
		dump_valve = Oxygen,MonoPropellant
	}

	Process
	{
		name = solid oxide electrolysis
		title = #KERBALISM_Process_SolidOxideElectrolysis
		modifier = _SOE
		input = ElectricCharge@0.010835259
		input = CarbonDioxide@2.0
		output = Oxygen@2.0121270980
		dump_valve = Oxygen
	}

	Process
	{
		name = molten regolith electrolysis
		title = #KERBALISM_Process_MoltenRegolithElectrolysis
		modifier = _MRE
		input = ElectricCharge@2.0
		input = Ore@0.00006342
		output = Oxygen@0.088843
		output = CarbonDioxide@0.00444215
		dump_valve = CarbonDioxide,Oxygen,CarbonDioxide&Oxygen
	}

	Process
	{
		name = selective catalytic oxidation
		title = #KERBALISM_Process_SelectiveCatalyticOxidation
		modifier = _SCO
		input = ElectricCharge@0.007166717
		input = Ammonia@2.0
		input = Oxygen@1.5371075987
		output = Nitrogen@1.0111298789
		output = Water@0.0024403982
		dump_valve = Water,Nitrogen
	}

	Process
	{
		name = MRE-Rock
		title = Molten Regolith Electrolysis (Rock)
		Tag = Sabe
		modifier = _MRER
		input = ElectricCharge@2.0
		input = Rock@0.000015855
		output = Oxygen@0.088843
		output = CarbonDioxide@0.00444215
		dump_valve = CarbonDioxide,Oxygen,CarbonDioxide&Oxygen
	}
}

@PART[*]:HAS[@MODULE[ProcessController]:HAS[#resource[_WasteCompressor]]]:NEEDS[Kerbalism,RationalResourcesKerbalism,ProfileModularScience]:FINAL
{
	// Waste compressor only outputs Shielding in the default profile.
	!MODULE[ProcessController]:HAS[#resource[_WasteCompressor]],* {}

	@MODULE[Configure],*
	{
		!SETUP:HAS[@MODULE:HAS[#id_value[_WasteCompressor]]],* {}
	}
}

@PART[*]:HAS[@MODULE[ProcessControllerSystemHeat]:HAS[#resource[_WasteCompressor]]]:NEEDS[Kerbalism,RationalResourcesKerbalism,ProfileModularScience]:FINAL
{
	// Waste compressor only outputs Shielding in the default profile.
	!MODULE[ProcessControllerSystemHeat]:HAS[#resource[_WasteCompressor]],* {}

	@MODULE[Configure],*
	{
		!SETUP:HAS[@MODULE:HAS[#id_value[_WasteCompressor]]],* {}
	}
}
