// The IR control unit declares these optional modules even when their plugins are absent.
@PART[IR_RoboticsControlUnit]:HAS[@MODULE[ModuleSequencer]]:NEEDS[InfernalRobotics,!IRSequencer]:FINAL
{
	!MODULE[ModuleSequencer],* {}
}

@PART[IR_RoboticsControlUnit]:HAS[@MODULE[kOSProcessor]]:NEEDS[InfernalRobotics,!kOS]:FINAL
{
	!MODULE[kOSProcessor],* {}
}
