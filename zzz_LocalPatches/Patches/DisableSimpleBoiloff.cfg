// Cryogenic boiloff is disabled because high-warp catch-up can drain propellant.
// Remove both CryoTanks/SimpleBoiloff and SystemHeat boiloff modules.
@PART[*]:HAS[@MODULE[ModuleCryoTank]]:NEEDS[CryoTanks&!SimpleBoiloff]:FINAL
{
	!MODULE[ModuleCryoTank],* {}
}

@PART[*]:HAS[@MODULE[ModuleSystemHeatCryoTank]]:NEEDS[SystemHeat]:FINAL
{
	!MODULE[ModuleSystemHeatCryoTank],* {}
}
