// KIS clones this part before ReStock replaces and prunes the stock model.
// Rebuild the failed clone from ReStock's final small-container configuration.
!PART[mediumCargoContainer]:NEEDS[KIS,ReStock]:AFTER[000_ReStock] {}

+PART[smallCargoContainer]:NEEDS[KIS,ReStock]:AFTER[000_ReStock]
{
	@name = mediumCargoContainer
	@rescaleFactor = 1.33
	@entryCost = 750
	@cost = 200
	@mass = 0.075
	@title = SEQ-6 Cargo Storage Unit
	%node_attach = 0,0,0.25,0,0,-1,0
	%node_stack_top = 0.0,0.35,0.0,0.0,1.0,0.0,1
	%node_stack_bottom = 0.0,-0.35,0.0,0.0,-1.0,0.0,1

	%MODULE[ModuleInventoryPart]
	{
		%InventorySlots = 6
	}

	%MODULE[ModuleKISItem]
	{
		%equipPos = 0,0.30,-0.30
	}
}
