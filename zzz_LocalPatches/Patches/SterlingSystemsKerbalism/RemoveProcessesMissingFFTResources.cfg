// Sterling 0.6 defines these Kerbalism processes without guarding their FFT-only outputs.
// Remove the unusable processes when Far Future Technologies is not installed.
@Profile[KerbalismSupport]:HAS[#moddir[SterlingSystemsKerbalism]]:NEEDS[SterlingSystemsKerbalism,!FarFutureTechnologies]:AFTER[SterlingSystemsKerbalism]
{
	!Process[FFTOrionPulse] {}
	!Process[UraniumSalter] {}
}
