// TU_Restock references this stock texture set while ReStock prevents its definition.
// The dangling entry makes KSPTextureSwitch throw while compiling these five parts.
@PART[miniFuelTank,restock-fuel-tank-0625-1,restock-fuel-tank-0625-2,restock-fuel-tank-0625-3,restock-fuel-tank-0625-5]:HAS[@MODULE[KSPTextureSwitch]:HAS[#textureSet[Stock_White_miniFuelTank]]]:NEEDS[TexturesUnlimited,ReStock]:AFTER[999_TU_Restock_Recolour_000]
{
	@MODULE[KSPTextureSwitch]:HAS[#textureSet[Stock_White_miniFuelTank]]
	{
		!textureSet,1 = delete
	}
}
