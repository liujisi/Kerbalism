// Add a hydrolox mode for the Twitch without changing its dry mass or thrust.
@PART[smallRadialEngine|smallRadialEngine_v2]:HAS[@MODULE[ModuleEnginesFX]]:NEEDS[B9PartSwitch,CryoTanks]:AFTER[CryoTanks]
{
	%TwitchIspVacLF = #$MODULE[ModuleEnginesFX]/atmosphereCurve/key,0[1, ]$
	%TwitchIspASLLF = #$MODULE[ModuleEnginesFX]/atmosphereCurve/key,1[1, ]$
	%TwitchThrust = #$MODULE[ModuleEnginesFX]/maxThrust$

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = engineSwitch
		switcherDescription = Propellant
		switcherDescriptionPlural = Propellants
		switchInFlight = False

		SUBTYPE
		{
			name = LFO
			title = #LOC_CryoTanks_switcher_fuel_lfox
			primaryColor = ResourceColorLiquidFuel
			secondaryColor = ResourceColorOxidizer

			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}
				DATA
				{
					maxThrust = #$/TwitchThrust$
					PROPELLANT
					{
						name = LiquidFuel
						ratio = 0.9
						DrawGauge = True
					}
					PROPELLANT
					{
						name = Oxidizer
						ratio = 1.1
					}
					atmosphereCurve
					{
						key = #0 $/TwitchIspVacLF$
						key = #1 $/TwitchIspASLLF$
						key = 7 0.001
					}
				}
			}
		}

		SUBTYPE
		{
			name = Hydrolox
			title = #LOC_CryoTanks_switcher_fuel_lh2ox
			primaryColor = ResourceColorLqdHydrogen
			secondaryColor = ResourceColorOxidizer

			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
				}
				DATA
				{
					maxThrust = #$/TwitchThrust$
					PROPELLANT
					{
						name = LqdHydrogen
						ratio = 1.5
						DrawGauge = True
					}
					PROPELLANT
					{
						name = Oxidizer
						ratio = 0.1
					}
					atmosphereCurve
					{
						key = 0 345
						key = 1 300
						key = 7 0.001
					}
				}
			}
		}
	}
}
