// Several installed part packs ship unguarded TweakScale modules.
// Without the TweakScale plugin they have no behavior and only generate PartLoader errors.
@PART[*]:HAS[@MODULE[TweakScale]]:NEEDS[!TweakScale]:FINAL
{
	!MODULE[TweakScale],* {}
}

// This legacy gantry stores scale-dependent values in a float field for TweakScale to replace.
// Use its middle/default-scale value when TweakScale is absent.
@PART[GantryLargeScaleableVariant]:HAS[@MODULE[MuMechToggle]]:NEEDS[InfernalRobotics,!TweakScale]:FINAL
{
	@MODULE[MuMechToggle]
	{
		@electricChargeRequired = 1.0
	}
}
