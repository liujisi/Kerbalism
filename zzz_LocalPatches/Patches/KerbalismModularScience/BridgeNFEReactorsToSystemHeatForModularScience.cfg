// NFE 2.x reactors under ProfileModularScience need the same Kerbalism/SystemHeat bridge
// as ProfileDefault, otherwise the original SystemHeat reactor remains an external EC producer.
@PART[nfe-reactor-*]:HAS[@MODULE[ProcessController]:HAS[#resource[_Nukereactor]],@MODULE[ModuleSystemHeatFissionReactor]]:NEEDS[NearFutureElectrical,Kerbalism,SystemHeat,zKerbalismBridge,zKerbalismProcess,ProfileModularScience]:BEFORE[zzzzzz_KerbalismNative]
{
	!MODULE[ModuleSystemHeatFissionReactor],* {}

	@MODULE[ProcessController]:HAS[#resource[_Nukereactor]]
	{
		@name = ProcessControllerSystemHeat
		%valve_i = 1
		%systemHeatModuleID = reactor
		%systemOutletTemperature = 800
		%systemPower = 100
		%CurrentPowerPercent = 100
		%MinimumThrottle = 10
		%meltdownTemperature = 1300
		%MaximumTemperature = 2000
		%CoreDamageRate = 0.008
		%CurrentSafetyOverride = 1000
		%allowManualShutdownTemperatureControl = true
		%AutoShutdown = true

		!coreDamageCurve {}
		coreDamageCurve
		{
			key = 1300 0.25
			key = 1650 0.75
			key = 2000 1.0
		}

		!systemEfficiency {}
		systemEfficiency
		{
			key = 0    0.0
			key = 800  1.0
			key = 1300 0.0
		}
	}

	@MODULE[Reliability]:HAS[#type[ProcessController]]
	{
		@type = ProcessControllerSystemHeat
		@mtbf = 230040000
	}

	!MODULE[PlannerController],* {}
}
