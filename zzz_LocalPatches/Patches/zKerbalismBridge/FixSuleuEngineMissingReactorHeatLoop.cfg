// SterlingSystems Engines/SystemHeatFissionEngines.cfg adds SystemHeat modules
// (ModuleSystemHeat, ModuleSystemHeatEngine, ModuleSystemHeatConverter) to SULEU
// engines. The zKerbalism bridge converts the converter to ProcessControllerSystemHeat.
// This integration is broken: no fuel storage, missing heat loop capacitor, missing
// Kerbalism runtime settings. Rather than continuing to patch around it, strip all
// SystemHeat and Kerbalism reactor modules and revert to the original plain NTR behavior.
@PART[strl-eng-*-suleu]:HAS[@MODULE[ModuleSystemHeatEngine]]:NEEDS[Kerbalism,SystemHeat,SterlingSystems,zKerbalismBridge]:AFTER[zKerbalismSterlingSystems]
{
	!MODULE[ProcessControllerSystemHeat]:HAS[#resource[_SULEU]] {}
	!MODULE[ModuleSystemHeatConverter] {}
	!MODULE[SystemHeatConverterKerbalismUpdater] {}
	!MODULE[ProcessController] {}
	!MODULE[PlannerController] {}
	!MODULE[Reliability]:HAS[#type[ProcessControllerSystemHeat]] {}
	!MODULE[Reliability]:HAS[#type[ModuleSystemHeatConverter]] {}
	!MODULE[Reliability]:HAS[#type[ModuleSystemHeatFissionEngine]] {}

	!MODULE[ModuleSystemHeat] {}
	!MODULE[ModuleSystemHeatEngine] {}
	!MODULE[SystemHeatFissionEngineKerbalismUpdater] {}
	!MODULE[ModuleSystemHeatFissionEngine] {}

	!RESOURCE[FissilePebbles] {}
	!RESOURCE[FizzledPebbles] {}
	!MODULE[ModuleSystemHeatFissionFuelContainer] {}

	@MODULE[ModuleEngines*],*
	{
		%heatProduction = 250
	}
}
