// zKerbalismBridge v1.0.8: SystemHeatFuelCells.cfg removes ModuleResourceConverter from
// MAEC fuel cell parts but the B9PartSwitch fuelSwitch subtypes still reference it.
// Remove obsolete ModuleResourceConverter IDENTIFIERs from B9PartSwitch subtypes.
@PART[strl-fuelcell-*|strl-worldpower-fuelcell*]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:NEEDS[CommunityResourcePack,B9PartSwitch,Kerbalism,SystemHeat,SterlingSystems,zKerbalismBridge,zKerbalismProcess]:AFTER[zKerbalismSterlingSystems]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE,*
		{
			!MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleResourceConverter]]] {}
		}
	}
}
