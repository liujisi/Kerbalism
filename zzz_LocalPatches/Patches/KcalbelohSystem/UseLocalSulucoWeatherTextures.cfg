// Load the packaged Suluco weather maps from local PluginData copies so EVE can
// sample them on the CPU without modifying the CKAN-owned distribution.
@EVE_CLOUDS:NEEDS[KcalbelohVolumetrics,StockVolumetricClouds]:AFTER[KcalbelohVolumetrics]
{
	@OBJECT[Suluco-Weather1]
	{
		@settings
		{
			@_MainTex
			{
				@value = zzz_LocalPatches/Assets/KcalbelohSystem/PluginData/Suluco_Weather1Coverage
			}
		}
		@layerRaymarchedVolumeV5
		{
			@coverageMap
			{
				@value = zzz_LocalPatches/Assets/KcalbelohSystem/PluginData/Suluco_Weather1Coverage
			}
			@cloudTypeMap
			{
				@value = zzz_LocalPatches/Assets/KcalbelohSystem/PluginData/Suluco_Weather1Type
			}
		}
	}

	@OBJECT[Suluco-Snow]
	{
		@settings
		{
			@_MainTex
			{
				@value = zzz_LocalPatches/Assets/KcalbelohSystem/PluginData/Suluco_Weather2Coverage
			}
		}
		@layerRaymarchedVolumeV5
		{
			@coverageMap
			{
				@value = zzz_LocalPatches/Assets/KcalbelohSystem/PluginData/Suluco_Weather2Coverage
			}
		}
	}
}
