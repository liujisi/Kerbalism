// ============================================================================
// Sterling Systems Kerbalism — FFT-dependent processes
//
// Removes FFTOrionPulse and UraniumSalter from the always-loaded profile
// and re-adds them only when Far Future Technologies is installed.
// This prevents "resource doesn't exist" warnings when FFT is absent.
// ============================================================================

// Remove FFT-dependent processes from the main support profile
@Profile:HAS[#name[KerbalismSupport],#modname[Sterling Systems Kerbalism]]:FOR[zzz_LocalPatches]
{
	!Process:HAS[#name[FFTOrionPulse]] {}
	!Process:HAS[#name[UraniumSalter]] {}
}

// Remove FFT-dependent pseudo-resource definitions
!RESOURCE_DEFINITION:HAS[#name[_FFTOrionPulse]]:FOR[zzz_LocalPatches] {}
!RESOURCE_DEFINITION:HAS[#name[_US]]:FOR[zzz_LocalPatches] {}

// Re-add conditionally when Far Future Technologies is present
Profile:NEEDS[FarFutureTechnologies]
{
	name = KerbalismSupport
	modname = Sterling Systems Kerbalism
	moddir = SterlingSystemsKerbalism

	Process
	{
		name = FFTOrionPulse
		title = FFT Orion Pulse Crafting
		Tag = SS
		modifier = _FFTOrionPulse
		input = ElectricCharge@0.0042
		input = Metals@0.0002 // 50% efficient
		input = RareMetals@0.00056 // 50% efficient
		input = Uraninite@0.00028
		output = FissionPulses@0.1
		output = Oxygen@0.13548
		dump_valve = Oxygen
	}
	Process
	{
		name = UraniumSalter
		title = Uranium Salter
		tag = SS
		modifier = _US
		input = EnrichedUranium@0.0002
		input = Water@1.0
		input = ElectricCharge@18.0
		output = NuclearSaltWater@1.0
	}

	RESOURCE_DEFINITION
	{
		name = _FFTOrionPulse
		density = 0.0
		isVisible = false
	}
	RESOURCE_DEFINITION
	{
		name = _US
		density = 0.0
		isVisible = false
	}
}
