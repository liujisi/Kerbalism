// ============================================================================
// Sterling Systems Kerbalism — FFT-dependent processes
//
// SterlingSystemsKerbalism's Profile.cfg unconditionally defines two
// processes (FFTOrionPulse, UraniumSalter) that depend on resources from
// Far Future Technologies (FissionPulses, NuclearSaltWater).
//
// When FFT is not installed, set skip_resources_validity_check = true
// so the Process constructor bypasses the resource existence check.
// Requires the Kerbalism DLL fix that corrects the inverted skip logic
// (|| changed to && ! in Process.cs).
//
// When FFT is installed, this patch does nothing — the processes load
// normally with real FFT resources available.
// ============================================================================

@Profile:HAS[#name[KerbalismSupport],#moddir[SterlingSystemsKerbalism]]:NEEDS[!FarFutureTechnologies]:FOR[zzz_LocalPatches]
{
	@Process:HAS[#name[FFTOrionPulse]]
	{
		%skip_resources_validity_check = true
	}
	@Process:HAS[#name[UraniumSalter]]
	{
		%skip_resources_validity_check = true
	}
}
