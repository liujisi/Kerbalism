// Sterling ICF engines already burn FusionPellets as their engine propellant.
// The optional FFT ModuleFusionEngine layer adds a separate D/He3 startup
// reactor gate that is not described by Sterling and can block activation.
@PART[strl-eng-*-icf]:HAS[@MODULE[ModuleFusionEngine]]:NEEDS[SterlingSystems,FarFutureTechnologies,SystemHeat]:AFTER[zKerbalismSterlingSystems]
{
	!MODULE[ModuleFusionEngine],* {}
	!MODULE[FFTFusionEngineKerbalismUpdater],* {}
	!MODULE[PlannerController]:HAS[#title[#LOC_KerbalismFFT_Brokers_FusionEngine]],* {}
}
